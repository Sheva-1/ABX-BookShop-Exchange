name: Build and Test App

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Récupérer le code source du dépôt
      uses: actions/checkout@v4

    - name: 2. Configurer l'environnement Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: 3. Installer les dépendances du projet
      run: npm install

    - name: 4. Lancer le build de production (Vite)
      run: npm run build
      env:
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    - name: 5. Conserver le dossier de build (dist) en artefact
      uses: actions/upload-artifact@v4
      with:
        name: production-dist
        path: dist
